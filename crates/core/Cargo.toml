[package]
name = "zspace-memo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core task model, ZSpace note codec, recurrence engine, reminder calculator, SQLite cache, and official zspace-cli NotebookProvider."

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
html-escape = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
