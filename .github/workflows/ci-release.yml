name: CI & Desktop Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-and-frontend:
    name: Core Tests, Lint & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy on core engine
        run: cargo clippy -p zspace-memo-core --all-targets -- -D warnings
      - name: Run Rust core tests
        run: cargo test -p zspace-memo-core
      - name: Install frontend dependencies, test & build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

  prepare-release:
    name: Prepare Draft Release
    needs: core-and-frontend
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.prep.outputs.release_id }}
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or reuse draft release for version
        id: prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          REL_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name==\"${TAG}\") | .id" | head -n1 || true)
          if [ -z "$REL_ID" ]; then
            REL_ID=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="ZSpace Kit ${TAG}" \
              -F draft=true \
              -F prerelease=false \
              --jq ".id")
          fi
          echo "release_id=${REL_ID}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build Tauri Desktop (${{ matrix.platform }})
    needs: [core-and-frontend, prepare-release]
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            cli_url: "https://update.zenithspace.net/AgentToolkit/20261023/zspace-cli-v0.3.11-darwin-arm64"
            cli_sha256: "f438303c204702e5028751c1c3a26d0c5ff0dc956801a6ef6dd30fbbb4338f7d"
            sidecar: "src-tauri/binaries/zspace-cli-aarch64-apple-darwin"
          - platform: windows-latest
            args: ""
            cli_url: "https://update.zenithspace.net/AgentToolkit/20261023/zspace-cli-v0.3.11-windows-x64.exe"
            cli_sha256: "5d5f1468dab6fd6151b03a96d7ddfd0aaf579730b4f37cbcc30ddfcdf54a8031"
            sidecar: "src-tauri/binaries/zspace-cli-x86_64-pc-windows-msvc.exe"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            .
          key: ${{ matrix.platform }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Download & verify official zspace-cli sidecar (v0.3.11)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -fsSL "${{ matrix.cli_url }}" -o "${{ matrix.sidecar }}"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${{ matrix.cli_sha256 }}  ${{ matrix.sidecar }}" | sha256sum -c -
          else
            echo "${{ matrix.cli_sha256 }}  ${{ matrix.sidecar }}" | shasum -a 256 -c -
          fi
          chmod +x "${{ matrix.sidecar }}" || true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tauri desktop Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: v__VERSION__
          releaseName: "ZSpace Kit v__VERSION__"
          releaseDraft: true
          prerelease: false
      - name: Upload built installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zspace-memo-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-desktop]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release for current version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_ID="${{ needs.prepare-release.outputs.release_id }}"
          TAG="${{ needs.prepare-release.outputs.tag }}"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" \
            -F draft=false \
            -f make_latest=true \
            -f target_commitish="${GITHUB_SHA}"
          echo "Published ${TAG} (release id ${REL_ID})"
